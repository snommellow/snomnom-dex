name: Regenerate Pokémon Data

on:
  push:
    branches:
      - main
      - claude/**
    paths:
      - 'lib/tcgapi.ts'
      - 'lib/pocketapi.ts'
      - 'lib/pokeapi.ts'
      - 'lib/trainerapi.ts'
      - 'lib/chains.ts'
      - 'scripts/**'
      - '.github/workflows/generate-pokemon-data.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Debug name verify
        run: npx tsx scripts/debug-name-verify.ts

      - name: Commit debug data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/debug-name-verify.json
          git commit -m "debug: verify sweep candidate names against Bulbapedia" || true
          git push --force-with-lease || true

      - name: Generate pokemon-data.json
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: npm run generate

      - name: Generate trainer-data.json
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: npm run generate:trainers

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/pokemon-data.json lib/trainer-data.json
          if git diff --cached --quiet; then
            echo "No changes to generated data"
          else
            git commit -m "chore: regenerate pokemon/trainer data"
            git push --force-with-lease
          fi
